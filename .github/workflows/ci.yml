name: CI
on: [push, pull_request]
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: banking_test, POSTGRES_USER: banking, POSTGRES_PASSWORD: banking_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U banking -d banking_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/banking_test
      DATABASE_USERNAME: banking
      DATABASE_PASSWORD: banking_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '25', cache: maven }
      - run: chmod +x mvnw
      - run: ./mvnw --batch-mode --update-snapshots verify

