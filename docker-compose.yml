services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: banking
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [banking_data:/var/lib/postgresql/data]
  api:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/banking
      DATABASE_USERNAME: banking
      DATABASE_PASSWORD: banking
      ALLOWED_ORIGINS: http://localhost:3000
      SPRING_PROFILES_ACTIVE: dev
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  banking_data: {}

